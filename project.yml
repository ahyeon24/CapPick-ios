name: CapPick
options:
  bundleIdPrefix: com.cappick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.0.0
targets:
  CapPick:
    type: application
    platform: iOS
    sources:
      - path: CapPick
        excludes:
          - Resources/E5Small
      - path: CapPick/Resources/E5Small
        type: folder
        buildPhase: resources
    # 자동 생성 Info.plist(INFOPLIST_KEY_*)로는 못 넣는 키만 여기 둔다 — 둘은 빌드 때 합쳐진다.
    info:
      path: CapPick/Info.plist
      properties:
        # XcodeGen이 버전을 고정값(1.0/1)으로 써넣지 않게 빌드 설정을 그대로 가리킨다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 실기기에서 같은 와이파이의 Mac(개발 서버, http)에 붙기 위한 설정. 로컬 네트워크
        # (.local 이름·사설 IP)만 암호화 없이 허용하고, 그 밖의 http는 계속 막힌다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "같은 와이파이에 있는 개발용 서버에 연결해요."
        # 실기기가 접속할 개발 서버(Mac)의 로컬 네트워크 이름. Mac에서 `scutil --get LocalHostName`
        # 으로 확인한다. IP 대신 이름을 쓰는 이유는 와이파이가 바뀌어도 그대로 동작하기 때문.
        CapPickDevServerHost: sim-ahyeon-ui-MacBookAir.local
    dependencies:
      - package: GRDB
      - package: OnnxRuntime
        product: onnxruntime
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cappick.ios
        PRODUCT_NAME: CapPick
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CapPick
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 2026-10-15 모노톤 디자인(사용자 결정): 앱 전체 강조색을 검정(AccentColor)으로, 흰 배경을
        # 유지하려고 라이트 모드로 고정한다. 다크 모드에서는 검정 강조색이 배경에 묻힌다.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CapPick은 사진 보관함에서 스크린샷만 찾아 분석해요. 스크린샷이 아닌 사진은 보지 않아요."
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  CapPickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CapPickTests
    dependencies:
      - target: CapPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cappick.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CapPick:
    build:
      targets:
        CapPick: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CapPickTests
    archive:
      config: Release
