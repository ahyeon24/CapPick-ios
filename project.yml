name: CapPick
options:
  bundleIdPrefix: com.cappick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.0.0
targets:
  CapPick:
    type: application
    platform: iOS
    sources:
      - path: CapPick
        excludes:
          - Resources/E5Small
      - path: CapPick/Resources/E5Small
        type: folder
        buildPhase: resources
    dependencies:
      - package: GRDB
      - package: OnnxRuntime
        product: onnxruntime
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cappick.ios
        PRODUCT_NAME: CapPick
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CapPick
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CapPick은 사진 보관함에서 스크린샷만 찾아 분석해요. 스크린샷이 아닌 사진은 보지 않아요."
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  CapPickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CapPickTests
    dependencies:
      - target: CapPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cappick.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CapPick:
    build:
      targets:
        CapPick: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CapPickTests
    archive:
      config: Release
